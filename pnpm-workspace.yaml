packages:
  - packages/*
  - apps/*
allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  electron: true
  esbuild: true
minimumReleaseAgeExclude:
  - '@vibecook/ghosttea@0.4.0'
  - '@vibecook/ghosttea-electron@0.4.0'
  - '@vibecook/ghosttea-frame@0.4.0'
  - '@vibecook/ghosttea-protocol@0.4.0'
  - '@vibecook/ghosttea-react@0.4.0'
verifyDepsBeforeRun: false

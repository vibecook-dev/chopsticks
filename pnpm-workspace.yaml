packages:
  - packages/*
  - apps/*
allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  electron: true
  esbuild: true
minimumReleaseAgeExclude:
  - '@vibecook/ghosttea@0.5.1'
  - '@vibecook/ghosttea-electron@0.5.1'
  - '@vibecook/ghosttea-frame@0.5.1'
  - '@vibecook/ghosttea-native-tabs@0.5.1'
  - '@vibecook/ghosttea-protocol@0.5.1'
  - '@vibecook/ghosttea-react@0.5.1'
  - '@vibecook/ghosttead@0.5.1'
  # The daemon platform packages arrive as optional dependencies of
  # @vibecook/ghosttead, and the release-age quarantine applies to them too.
  - '@vibecook/ghosttead-darwin-arm64@0.5.1'
  - '@vibecook/ghosttead-win32-x64@0.5.1'
  - '@vibecook/ghosttea-client@0.5.1'
verifyDepsBeforeRun: false

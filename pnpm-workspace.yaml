packages:
  - packages/*
  - apps/*
allowBuilds:
  '@parcel/watcher': true
  '@vibecook/truffle': set this to true or false
  better-sqlite3: true
  electron: true
  esbuild: true
minimumReleaseAgeExclude:
  - '@vibecook/ghosttea@0.8.0'
  - '@vibecook/ghosttea-electron@0.8.0'
  - '@vibecook/ghosttea-frame@0.8.0'
  - '@vibecook/ghosttea-native-tabs@0.8.0'
  - '@vibecook/ghosttea-protocol@0.8.0'
  - '@vibecook/ghosttea-react@0.8.0'
  - '@vibecook/ghosttead@0.8.0'
  # The daemon platform packages arrive as optional dependencies of
  # @vibecook/ghosttead, and the release-age quarantine applies to them too.
  - '@vibecook/ghosttead-darwin-arm64@0.8.0'
  - '@vibecook/ghosttead-win32-x64@0.8.0'
  - '@vibecook/ghosttea-client@0.8.0'
  - '@vibecook/truffle-native@0.7.11'
  - '@vibecook/truffle-sidecar-darwin-arm64@0.7.11'
  - '@vibecook/truffle-sidecar-darwin-x64@0.7.11'
  - '@vibecook/truffle-sidecar-linux-arm64@0.7.11'
  - '@vibecook/truffle-sidecar-linux-x64@0.7.11'
  - '@vibecook/truffle-sidecar-win32-x64@0.7.11'
  - '@vibecook/truffle@0.7.11'
verifyDepsBeforeRun: false

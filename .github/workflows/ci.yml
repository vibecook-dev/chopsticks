name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
          cache: pnpm

      # The publishable library graph is intentionally independent of the
      # private workbench's local Ghosttea development links.
      - run: pnpm install --frozen-lockfile --filter './packages/**'

      - run: pnpm format:check
        if: runner.os == 'Linux'
      - run: pnpm surface:audit
      - run: pnpm -r --filter './packages/**' typecheck
      - run: pnpm -r --filter './packages/**' test
      - run: pnpm -r --filter './packages/**' build
      - run: node scripts/pack-check.mjs

  apps:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
          cache: pnpm

      # The apps became registry-only consumers when Ghosttea started publishing
      # the daemon and the native tabs addon, so they can finally be built here.
      # Electron itself is never launched — no smoke run — so skip its download.
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - run: pnpm -r --filter './apps/**' typecheck
      - run: pnpm -r --filter './apps/**' test

      # Linux has neither a native tabs prebuild nor a ghosttead one, so both
      # stages are skipped and this gates the bundle graph, not what ships.
      - run: pnpm godview:bundle
        if: runner.os == 'Linux'
      - run: pnpm workbench:bundle
        if: runner.os == 'Linux'
